name: Qualidade do código do Mistureba

on:
  push:
    paths:
      - "mistureba/**"
      - ".github/workflows/mistureba.yml"
  pull_request:
    paths:
      - "mistureba/**"
      - ".github/workflows/mistureba.yml"

jobs:
  verificar:
    name: Formatação, lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mistureba
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rokit
        # a API do GitHub às vezes recusa (403) por limite; tenta de novo algumas vezes
        run: |
          for tentativa in 1 2 3 4; do
            if curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash; then
              break
            fi
            if [ "$tentativa" = 4 ]; then exit 1; fi
            sleep $((tentativa * 15))
          done
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
        env:
          # sem token a API do GitHub às vezes recusa (403) e a instalação falha
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar ferramentas (Rojo, Selene, StyLua)
        run: rokit install --no-trust-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Formatação (StyLua)
        run: stylua --check src

      - name: Lint (Selene)
        run: selene src

      - name: Teste de balanceamento da economia
        run: python3 tools/balanceamento.py

      - name: Montar o jogo (Rojo)
        run: rojo build -o mistureba.rbxl
